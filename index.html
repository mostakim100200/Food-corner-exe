<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রাতুলের ফুড কর্নার</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #fff8f0; color: #333; }
  header { background: #e63946; color: white; padding: 20px; text-align: center; }
  header h1 { font-size: 28px; }
  .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; display: flex; flex-wrap: wrap; gap: 20px; }
  .menu { flex: 2; min-width: 300px; }
  .cart { flex: 1; min-width: 280px; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); height: fit-content; }
  .item { background: white; padding: 15px; margin-bottom: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .item h3 { margin-bottom: 4px; }
  .item .price { color: #e63946; font-weight: bold; }
  button { background: #e63946; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:hover { background: #c1121f; }
  .cart-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; padding-bottom: 8px; border-bottom: 1px solid #eee; }
  .qty button { padding: 2px 8px; }
  .total { font-size: 20px; font-weight: bold; margin: 15px 0; }
  input, textarea { width: 100%; padding: 8px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  #message { margin-top: 15px; padding: 12px; background: #d8f3dc; border-radius: 8px; display: none; }
</style>
</head>
<body>

<header>
  <h1>🍔 রাতুলের ফুড কর্নার</h1>
  <p>আপনার পছন্দের খাবার অর্ডার করুন</p>
</header>

<div class="container">
  <div class="menu">
    <h2 style="margin-bottom:12px;">আমাদের মেনু</h2>
    <div id="menuList"></div>
  </div>

  <div class="cart">
    <h2>আপনার কার্ট</h2>
    <div id="cartItems"><p>কার্ট খালি</p></div>
    <div class="total">মোট: ৳<span id="totalPrice">0</span></div>

    <h3>অর্ডার করুন</h3>
    <input type="text" id="name" placeholder="আপনার নাম">
    <input type="text" id="phone" placeholder="ফোন নম্বর">
    <textarea id="address" rows="3" placeholder="ডেলিভারি ঠিকানা"></textarea>
    <button onclick="placeOrder()" style="width:100%; margin-top:8px;">অর্ডার কনফার্ম করুন</button>
    <div id="message"></div>
  </div>
</div>

<script>
  // এখানে মেনুর খাবার আর দাম বদলাতে পারো
  const menu = [
    { id: 1, name: "কাচ্চি বিরিয়ানি", price: 250 },
    { id: 2, name: "চিকেন বার্গার", price: 180 },
    { id: 3, name: "বিফ তেহারি", price: 200 },
    { id: 4, name: "ফ্রাইড চিকেন", price: 220 },
    { id: 5, name: "ফুচকা", price: 60 },
    { id: 6, name: "লাচ্ছি", price: 80 }
  ];

  // এখানে তোমার হোয়াটসঅ্যাপ নম্বর বসাও। শুরুতে 88 দিয়ে, প্লাস বা শূন্য ছাড়া। যেমন: 8801712345678
  const MY_WHATSAPP = "8801816605328";

  let cart = {};

  function showMenu() {
    const list = document.getElementById("menuList");
    list.innerHTML = "";
    menu.forEach(item => {
      list.innerHTML += `
        <div class="item">
          <div>
            <h3>${item.name}</h3>
            <span class="price">৳${item.price}</span>
          </div>
          <button onclick="addToCart(${item.id})">কার্টে যোগ করুন</button>
        </div>`;
    });
  }

  function addToCart(id) {
    cart[id] = (cart[id] || 0) + 1;
    showCart();
  }

  function changeQty(id, change) {
    cart[id] = (cart[id] || 0) + change;
    if (cart[id] <= 0) delete cart[id];
    showCart();
  }

  function showCart() {
    const box = document.getElementById("cartItems");
    let total = 0;
    let html = "";
    for (const id in cart) {
      const item = menu.find(m => m.id == id);
      const sub = item.price * cart[id];
      total += sub;
      html += `
        <div class="cart-row">
          <span>${item.name}</span>
          <span class="qty">
            <button onclick="changeQty(${id}, -1)">-</button>
            ${cart[id]}
            <button onclick="changeQty(${id}, 1)">+</button>
          </span>
          <span>৳${sub}</span>
        </div>`;
    }
    box.innerHTML = html || "<p>কার্ট খালি</p>";
    document.getElementById("totalPrice").textContent = total;
  }

  function placeOrder() {
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const address = document.getElementById("address").value.trim();
    const msg = document.getElementById("message");

    if (Object.keys(cart).length === 0) { alert("আগে কার্টে খাবার যোগ করুন"); return; }
    if (!name || !phone || !address) { alert("নাম, ফোন আর ঠিকানা দিন"); return; }

    let text = "নতুন অর্ডার!\n\n";
    let total = 0;
    for (const id in cart) {
      const item = menu.find(m => m.id == id);
      const sub = item.price * cart[id];
      total += sub;
      text += item.name + " x " + cart[id] + " = ৳" + sub + "\n";
    }
    text += "\nমোট: ৳" + total;
    text += "\n\nনাম: " + name;
    text += "\nফোন: " + phone;
    text += "\nঠিকানা: " + address;

    const url = "https://wa.me/" + MY_WHATSAPP + "?text=" + encodeURIComponent(text);
    window.open(url, "_blank");

    msg.style.display = "block";
    msg.textContent = "ধন্যবাদ " + name + "! হোয়াটসঅ্যাপে মেসেজটা খুলেছে, শুধু সেন্ড চাপুন, তাহলেই অর্ডার পাকা।";
  }

  showMenu();
</script>

</body>
</html>
